# Postgres local para desenvolvimento: `docker compose up -d` (ou `podman compose up -d`)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vgm
      POSTGRES_PASSWORD: vgm
      POSTGRES_DB: vgm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vgm -d vgm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
