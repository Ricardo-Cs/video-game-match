packages:
  - apps/*
  - packages/*

# Versões compartilhadas: os package.json referenciam com "catalog:".
# O zod precisa ser o mesmo em todo lugar, já que os schemas cruzam pacotes.
catalog:
  typescript: ~5.9.3
  zod: ^4.1.11
  vitest: ^4.1.11

# GHSA-ggr8-5vv4-36mx: o Prisma 6 (via @prisma/config) fixa deepmerge-ts 7.x.
# Remover ao migrar para Prisma >= 7.10.1, que já traz a 8.x (etapa 3 do ROADMAP).
overrides:
  deepmerge-ts: ^8.0.2

# Proteção contra pacote comprometido: só instala versões publicadas há 7+ dias
minimumReleaseAge: 10080

# Dependências autorizadas a rodar scripts de instalação
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
